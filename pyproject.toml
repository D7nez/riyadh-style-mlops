[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "riyadh-style-mlops"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "groq>=0.11,<1", "langsmith>=0.3,<1", "mlflow>=3.5,<4", "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "PyYAML>=6,<7", "python-dotenv>=1,<2", "httpx>=0.27,<1"]
[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
[project.scripts]
styleops = "styleops.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
