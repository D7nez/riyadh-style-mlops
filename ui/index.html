<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>Riyadh Style MLOps</title><style>body{font:18px system-ui;max-width:900px;margin:50px auto;padding:20px;background:#f4f7f9;color:#18394b}textarea,input,select,button{font:inherit;padding:12px;margin:8px 0;box-sizing:border-box}textarea{width:100%;height:180px}button{background:#096b67;color:white;border:0;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;background:white;padding:25px;border-radius:12px}label{display:block}</style><h1>استوديو الصياغة العربية</h1><p>صياغة مؤسسية مستوحاة من الأمثلة. راجع الحقائق قبل الاستخدام.</p><label>مفتاح التطبيق إن كان مفعّلًا <input id="key" type="password" autocomplete="off"></label><select id="type"><option>مقال</option><option>كلمة رسمية</option><option>تغريدة</option><option>فقرة قصيرة</option><option>تقرير</option></select><textarea id="text" placeholder="أدخل النص الأصلي"></textarea><button id="run">تحويل النص</button><p id="status"></p><pre id="output"></pre><details><summary>تفاصيل الطلب والتقييم</summary><pre id="debug"></pre></details><script>
const $=id=>document.getElementById(id);$('run').onclick=async()=>{ $('run').disabled=true;$('status').textContent='جارٍ التنفيذ';try{const r=await fetch('/transform',{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':$('key').value},body:JSON.stringify({text:$('text').value,text_type:$('type').value})});const d=await r.json();$('status').textContent='Request ID: '+r.headers.get('X-Request-ID');if(!r.ok)throw Error(JSON.stringify(d));$('output').textContent=d.output;$('debug').textContent=JSON.stringify({...d,output:undefined},null,2);}catch(e){$('output').textContent=e.message;}finally{$('run').disabled=false;}};
</script></html>
